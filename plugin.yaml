name: vibeline
version: 0.2.0
description: "Show agent work as rails in the TUI, web and CLI. One lane per agent, tool calls and results as marks. /rails and hermes vibeline."
author: ListeningPost
license: MIT
manifest_version: 2
requires_hermes: ">=0.22.0"
api_version: 1
tags: [rails, ledger, cli, markdown, swarm, feedback]
provides_tools:
  - vibeline_rails
  - vibeline_dashboard
config_schema:
  db:
    type: str
    default: ""
    description: "Path to the append-only events sqlite (TRACE_DB). Empty = auto."
  show_tokens:
    type: bool
    default: false
    description: "Include token counts in markdown (off by default)."
